[project]
name = "tinception"
version = "2.0.0.dev0"
description = "Multi-site structural MRI analysis of tinnitus: normative modelling, hearing-loss dissociation and heterogeneity"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Payam S. Shabestari" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyreadstat>=1.2",
    "nibabel>=5.2",
    "nilearn>=0.11",
    "statsmodels>=0.14",
    "pingouin>=0.5.4",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pcntoolkit>=1.3,<1.4",
]

[project.optional-dependencies]
maps = [
    "neuromaps>=0.0.5",
    "abagen>=0.1.3",
    "setuptools<81",  # abagen imports pkg_resources
    "brainspace>=0.1.10",
    "brainsmash>=0.11",
    "surfplot>=0.2",
]
subtyping = [
    "snfpy>=0.2.2",
    "gemmr>=0.4",
    "cca-zoo>=2.5",
    "umap-learn>=0.5",
]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinception"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
