# Analysis parameters shared by all steps.
seed: 42

audiometry:
  pta4_freqs: [500, 1000, 2000, 4000]      # WHO/ISO PTA4
  pta_hf_freqs: [4000, 8000]               # primary high-frequency PTA (all audiogram sites have 4 & 8 kHz)
  pta_hf468_freqs: [4000, 6000, 8000]      # secondary; 6 kHz missing at cogtail, london_1, tinspect
  pta_ehf_freqs: [10000, 12000, 12500, 14000, 16000]  # extended high frequency (>=2 of these), subset only
  hl_threshold_db: 25                      # PTA4 > 25 dB HL -> hearing loss (primary group4)
  hl_hf_threshold_db: 25                   # PTA_HF (4+8 kHz) > 25 dB HL -> HF hearing loss (group4_hf, sensitivity)
  min_freqs_required: all                  # 'all' or an int: minimum measured freqs to compute a PTA

phenotypes:
  sex_coding: {0: F, 1: M}                 # verified via eTIV per site (males larger at all 13 sites)
  distress_instruments: [THI, TFI]
  affect_instruments: [BDI, BAI, HADS, MDI]

freesurfer:
  version: 8.0.0
  build: freesurfer-linux-ubuntu20_x86_64-8.0.0-20250204-0f2bd3a

t1_inputs:                   # non-default T1w inputs, shared by FreeSurfer v2 and CAT12
  n4_sites: [london_2]       # N4-corrected input <derivatives>/<n4_dir>/<sub>_T1w.nii.gz (64-ch coil, no prescan normalise)
  n4_dir: n4_london2
  acq:                       # rawdata/<sub>/anat/<sub>_acq-<acq>_T1w.nii.gz
    sub-london1AGe1: echomean
    sub-london1DWCe1: echomean
  skip: [sub-london1CKCe1]   # no T1w in the source data (legacy file was a copy of DWCe1)

cat12:                       # volume-only (user decision 2026-10-27): secondary/exploratory VBM + cerebellar ROIs
                             # record of the settings; applied in config/cat12_segment.m (vox, atlases) and
                             # slurm/05_cat12.sbatch (FWHM) -> keep in sync
  version: "12.9"
  revision: r2665
  batch: config/cat12_segment.m   # MNI152NLin2009cAsym Geodesic Shooting template (CAT12 default), no surfaces
  vox_mm: 1.5
  smoothing_fwhm: [6, 8]     # 6 mm primary, 8 mm sensitivity
  atlases: [neuromorphometrics, cobra, suit]
  iqr_max_mark: 3.5          # exclude IQR worse than grade C (mark > 3.5 = rating < 70%)

normative:                   # step 07 (user decisions 2026-10-27; analysis plan 6.3)
  engine: blr                # PCNtoolkit 1.3 BLR at every level (ROI, vertex, voxel); HBR only as robustness
  warp: WarpSinhArcsinh      # non-Gaussian (skew / kurtosis) likelihood
  age_knots: 5               # cubic B-spline on age (first covariate); all other covariates enter linearly
  bspline_degree: 3
  batch_effects: [site, sex] # site- and sex-specific mean AND variance (fixed_effect + fixed_effect_var);
                             # a reference can set batch_variance: false (batch effects on the mean only)
  heteroskedastic: true      # variance also varies with age
  folds: 10                  # cross-fitting of the reference sample, stratified by site x sex
  extreme_z: 2.6
  models:                    # covariate ladder (no Euler: QC rule + downstream covariate instead)
    A: []
    B4: [PTA4]
    B: [PTA4, PTA_HF]
  references:                # who the model is trained on (only subjects in_case_control are scored)
    CO: {column: group, value: CO}        # primary: all non-tinnitus controls (CTRL + HLOS)
                             # CO keeps site-/sex-specific variance: a shared-variance CO fit (2026-10-28) left residual
                             # site differences in spread (Brown-Forsythe, FDR) in 1-3 features, so it failed calibration
    CTRL: {column: group4, value: CTRL, batch_variance: false}   # secondary: normal-hearing controls; one variance
                             # shared across sites/sexes (2026-10-28: site-specific variance from 6-9 controls at small
                             # sites gave heavy-tailed held-out z in 44-56 features)
  tiv_column: eTIV           # added as a linear covariate for feature sets with tiv: true (not thickness)
  feature_sets:              # <derivatives>/features/<table>.tsv; include = regex, exclude = regex
    dk_thick: {table: dk, include: "^thick__(lh|rh)_", exclude: "MeanThickness", tiv: false}
    dk_area: {table: dk, include: "^area__(lh|rh)_", exclude: "WhiteSurfArea", tiv: true}
    aseg: {table: aseg, include: "^(Left|Right)-(Thalamus|Caudate|Putamen|Pallidum|Hippocampus|Amygdala|Accumbens-area)$", tiv: true}
    subseg: {table: subseg, include: "^(hippo|amyg|thal)__", exclude: "fissure", tiv: true}
  loso:                      # leave-one-site-out transfer check of the ROI models (scripts/07c_normative_loso.py)
    references: [CO]
    adapt_folds: 5           # within-site folds giving the left-out site's controls out-of-sample z (fewer if small)
    min_profile_r: 0.8       # a site passes if the median per-subject deviation-profile r (full vs LOSO) >= this
                             # and the mean LOSO z of its controls does not differ from 0 (95% CI)
  maps:                      # phase 2 (scripts/07b_normative_maps.py): same BLR settings, batched over vertices/voxels
    references: [CO]         # primary reference only at map level (compute); CTRL is covered at ROI level
    chunk: 500               # features per SLURM task (each = 500 x 11 BLR fits)
    sets:
      vertex_thickness: {source: vertex, measure: thickness, tiv: false}   # features/vertex_fsavg5_fwhm10_<measure>.npy
      vertex_area: {source: vertex, measure: area, tiv: true}
      voxel_gm: {source: voxel, input: s6mwp1, tiv: true, tiv_column: cat12_TIV}   # CAT12 modulated GM, 6 mm
    voxel_mm: 3              # CAT12 maps resampled from 1.5 mm
    voxel_mask_threshold: 0.1  # keep voxels whose mean (resampled) modulated GM across subjects exceeds this
  calibration:               # D1: pooled thresholds; per site a 95% CI criterion (11-80 controls per site)
    pooled_mean_abs: 0.1
    pooled_sd: [0.9, 1.1]
    site_skew_abs: 1.0
    feature: {mean_abs: 0.1, sd: [0.9, 1.1], skew_abs: 1.0}   # per feature; failing ROI features excluded from H2
    maps: {max_frac_batch_hits: 0.01, max_frac_features_failing: 0.05}   # map level: bounded fractions instead
    batch_fdr_q: 0.05        # no feature may show a residual site or sex effect in held-out control z, in mean
                             # (one-way ANOVA) or spread (Brown-Forsythe), BH-FDR; replaces the cross-validated site
                             # AUC, which anti-learns on site-centred z (2026-10-28)

group:                       # step 08 (analysis plan 5.2, 5.3, 6.1; decisions D1-D4 2026-10-29)
  age_df: 3                  # natural cubic spline of age
  covariates: [sex, euler_total]   # + age spline; + hearing per model; + log eTIV for volumes/areas (D1)
  families: [dk_thick, dk_area, aseg]   # normative.feature_sets entries; tiv: true = volumetric -> log (D1)
  apriori:                   # H1b auditory-limbic family (16 measures)
    - thick__lh_transversetemporal
    - thick__rh_transversetemporal
    - area__lh_transversetemporal
    - area__rh_transversetemporal
    - thal__Left-MGN
    - thal__Right-MGN
    - Left-Hippocampus
    - Right-Hippocampus
    - Left-Amygdala
    - Right-Amygdala
    - Left-Accumbens-area
    - Right-Accumbens-area
    - thick__lh_medialorbitofrontal
    - thick__rh_medialorbitofrontal
    - thick__lh_rostralanteriorcingulate
    - thick__rh_rostralanteriorcingulate
  h1a: [thick__lh_transversetemporal, thick__rh_transversetemporal]   # PTA4 effect, one-sided (negative)
  subregions:                # three-tier rule (plan 5.3); whole structure from the same segmentation
    hippo: {pattern: "^hippo__(lh|rh)_", whole: "hippo__{h}_Whole_hippocampus",
            parts_exclude: "Whole_|fissure"}
    amyg: {pattern: "^amyg__(lh|rh)_", whole: "amyg__{h}_Whole_amygdala", parts_exclude: "Whole_"}
    thal: {pattern: "^thal__(Left|Right)-", whole: "thal__{h}-Whole_thalamus", parts_exclude: "Whole_"}
  fdr_q: 0.05
  tost_d: 0.2                # smallest effect size of interest for equivalence (H1b/H1c nulls, H1d)
  spin_n: 10000
  bootstrap_n: 5000          # H1d attenuation CIs (cluster)
  spatial_r_max: 0.5         # H1c: tinnitus map not spatially equivalent to the hearing maps

h3:                          # dimensions and subtypes in patients (analysis plan 6.5; decisions D1-D3 2026-10-30)
  model_primary: A           # D1: Model A deviations (hearing variance still present); Model B secondary
  model_secondary: B
  features: F1F3             # DK thickness + 14 subcortical volumes, calibrated features only
  clinical: [distress_z, PTA4, PTA_HF]
  clinical_extra: [hyperacusis_z, affect_z, log_duration]   # exploratory, added one at a time
  hearing: [PTA4, PTA_HF]     # hearing-only PLS (plan 6.9 A)
  validation: [hyperacusis_z, affect_z, log_duration, distress_z]   # subtype criterion 5 (not used for clustering)
  n_perm: 10000              # within-site permutations (PLS mode 1 and its leave-one-site-out replication)
  n_boot: 1000               # bootstrap ratios of the PLS weights
  pca_var: 0.8               # D3: PCA on held-out control deviations, components up to 80% variance
  ks: [1, 2, 3, 4, 5, 6]
  null_sims: 200             # no-cluster Gaussian null
  stability_boot: 200
  min_stability_ari: 0.6
  min_loso_ari: 0.5
  max_site_cramers_v: 0.2

network:                     # plan 6.9 B: hub / epicentre models with ENIGMA Toolbox normative HCP connectivity (DK)
  spin_n: 10000              # group maps (cortex); subcortical maps: shuffle null with the same n
  subject_spin_n: 1000       # per-subject epicentres
  alpha_subject: 0.05        # per-subject epicentre: spin p below this
  deviation_models: [B, A]   # per-subject epicentres: Model B primary (as H2), A secondary
  h3_model: B                # H3 maps: the confound-regressed mode that replicated (plan 6.9 A) is Model B
  h1_contrasts: {tinnitus: tinnitus, PTA4: PTA4, PTA_HF_beyond_PTA4: PTA_HF_beyond_PTA4}

stats:
  n_perm: 5000
  fdr_alpha: 0.05

qc:
  mad_k: 3.5                 # robust site-wise |z| beyond which a metric is an outlier (bad direction only)
  min_iqm_outliers: 2        # flag for visual review if >= this many MRIQC IQMs are outliers
  euler_abs_floor: -434      # PRIMARY RULE (user-approved 2026-10-01): exclude recon-all failures + total Euler below
                             # this (~ -217 per hemisphere, Rosen 2018). Flags are informational (visually checked).
  strict:                    # sensitivity exclusion rule -> qc_strict_exclude
    euler_abs_floor: -300
    euler_site_z: -4
    iqm_k: 4
    min_iqm_outliers: 2
  fs_input_notes:            # subjects whose FreeSurfer input differs from the site default
    sub-london1AGe1: "mean of 6 MPM T1w echoes (echo-1 recon-all failed); Euler -644"
    sub-london1DWCe1: "mean of 6 MPM T1w echoes (echo-1 recon-all failed); Euler -440"
